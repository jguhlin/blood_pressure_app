[tool.black]
line-length = 100
target-version = ["py311", "py310", "py39"]

[tool.ruff]
line-length = 100
indent-width = 4
src = ["."]
target-version = "py311"
select = [
  "E", "F",        # pycodestyle + pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # flake8-bugbear
]
ignore = [
  # Long lines are handled by black; be pragmatic in docs/gen code
  "E501",
]
